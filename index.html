<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nexus AI - 智能系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK (Compat Version for standalone HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { 
            background-color: #09090b; 
            color: white; 
            -webkit-tap-highlight-color: transparent; 
        }
        .pb-safe { 
            padding-bottom: env(safe-area-inset-bottom); 
        }
        /* 防止iOS输入时自动放大页面 */
        input, textarea { 
            font-size: 16px !important; 
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 核心配置：你的 Firebase 密钥 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBAxYsXa51rHYE8l43qnUsn9fBNdfQMIho",
            authDomain: "my-love-33128.firebaseapp.com",
            projectId: "my-love-33128",
            storageBucket: "my-love-33128.firebasestorage.app",
            messagingSenderId: "635718475205",
            appId: "1:635718475205:web:669f300663b0102b3fffac"
        };

        // 初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [user, setUser] = useState(null);
            const [path, setPath] = useState(window.location.hash || '#/');
            const [activeSid, setActiveSid] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [chat, setChat] = useState(null);
            const [input, setInput] = useState('');
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [pass, setPass] = useState('');
            const chatEndRef = useRef(null);

            // 1. 初始化用户和路由
            useEffect(() => {
                auth.signInAnonymously().then(res => setUser(res.user)).catch(err => console.error("登录失败:", err));
                const handleHash = () => setPath(window.location.hash || '#/');
                window.addEventListener('hashchange', handleHash);
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            const isAdmin = path === '#/admin';

            // 2. 访客逻辑：监听自己的聊天室
            useEffect(() => {
                if (!user || isAdmin) return;
                const sid = `session_${user.uid}`;
                setActiveSid(sid);
                const unsub = db.collection('chats').doc(sid).onSnapshot(doc => {
                    if (doc.exists) {
                        setChat(doc.data());
                    } else {
                        // 首次进入，创建聊天记录
                        doc.ref.set({ 
                            id: sid, 
                            messages: [{role:'ai', content:'您好！系统已就绪，我是您的 AI 助理，请问有什么可以帮您的？', ts:Date.now()}], 
                            lastUpdate: Date.now() 
                        });
                    }
                }, err => console.error("监听数据失败:", err));
                return unsub;
            }, [user, isAdmin]);

            // 3. 管理员逻辑：获取所有访客列表
            useEffect(() => {
                if (!user || !isAdmin || !isUnlocked) return;
                const unsub = db.collection('chats').onSnapshot(snap => {
                    const list = snap.docs.map(d => d.data());
                    // 按最新时间排序
                    setSessions(list.sort((a, b) => b.lastUpdate - a.lastUpdate));
                });
                return unsub;
            }, [user, isAdmin, isUnlocked]);

            // 4. 管理员逻辑：监听选中的特定访客聊天
            useEffect(() => {
                if (!isAdmin || !activeSid || !isUnlocked) return;
                const unsub = db.collection('chats').doc(activeSid).onSnapshot(doc => {
                    if (doc.exists) setChat(doc.data());
                });
                return unsub;
            }, [activeSid, isUnlocked]);

            // 收到新消息自动滚动到底部
            useEffect(() => { 
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); 
            }, [chat?.messages]);

            // 发送消息
            const send = async (e) => {
                e?.preventDefault();
                if (!input.trim() || !activeSid) return;
                
                const msg = { 
                    role: isAdmin ? 'ai' : 'user', 
                    content: input.trim(), 
                    ts: Date.now() 
                };
                
                const backupText = input; 
                setInput(''); // 先清空输入框提升体验
                
                try {
                    await db.collection('chats').doc(activeSid).update({
                        messages: firebase.firestore.FieldValue.arrayUnion(msg),
                        lastUpdate: Date.now()
                    });
                } catch(err) { 
                    console.error("发送失败:", err);
                    setInput(backupText); // 失败时恢复文字
                    alert("消息发送失败，请确保你的 Firebase 数据库已设置为【测试模式】启动！"); 
                }
            };

            // 拦截回车键发送
            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    send();
                }
            };

            // --- 界面渲染部分 ---

            if (!user) {
                return <div className="h-screen flex items-center justify-center text-zinc-500 text-sm tracking-widest">正在连接核心网络...</div>;
            }

            // ==========================================
            // 视图 1：普通访客界面 (纯洁的 AI 界面)
            // ==========================================
            if (!isAdmin) {
                return (
                    <div className="flex flex-col h-screen h-[100dvh] bg-zinc-950">
                        <header className="px-4 py-3 border-b border-zinc-800 flex items-center gap-3 bg-black/80 backdrop-blur-md shrink-0 z-10 sticky top-0">
                            <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                                <i data-lucide="bot" className="text-white w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-base tracking-tight text-white leading-tight">Nexus AI</h1>
                                <div className="flex items-center gap-1.5 mt-0.5">
                                    <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                                    <span className="text-[10px] text-zinc-400 font-bold uppercase tracking-widest">System Online</span>
                                </div>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-6 space-y-5">
                            <div className="max-w-3xl mx-auto space-y-5">
                                {chat?.messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-300`}>
                                        <div className={`p-3.5 rounded-2xl max-w-[85%] md:max-w-[75%] text-[15px] leading-relaxed shadow-sm ${
                                            m.role==='user' 
                                            ? 'bg-indigo-600 text-white rounded-tr-none' 
                                            : 'bg-zinc-800 text-zinc-200 rounded-tl-none border border-zinc-700/50'
                                        }`}>
                                            <span className="whitespace-pre-wrap break-words">{m.content}</span>
                                        </div>
                                    </div>
                                ))}
                                <div ref={chatEndRef} className="h-2" />
                            </div>
                        </main>

                        <footer className="p-3 md:p-4 bg-black border-t border-zinc-800 pb-safe shrink-0">
                            <form onSubmit={send} className="max-w-3xl mx-auto flex gap-2">
                                <textarea 
                                    value={input} 
                                    onChange={e=>setInput(e.target.value)} 
                                    onKeyDown={handleKeyDown}
                                    placeholder="输入消息..." 
                                    className="flex-1 bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3.5 outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all text-base placeholder:text-zinc-500 resize-none max-h-32" 
                                    rows="1"
                                />
                                <button 
                                    type="submit" 
                                    disabled={!input.trim()} 
                                    className="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center shrink-0 disabled:opacity-50 active:scale-95 transition-all shadow-lg shadow-indigo-600/20"
                                >
                                    <i data-lucide="send" className="text-white ml-1"></i>
                                </button>
                            </form>
                        </footer>
                    </div>
                );
            }

            // ==========================================
            // 视图 2：管理员密码锁界面
            // ==========================================
            if (isAdmin && !isUnlocked) {
                return (
                    <div className="h-screen h-[100dvh] flex items-center justify-center bg-black p-4 font-sans">
                        <form 
                            onSubmit={e=>{
                                e.preventDefault(); 
                                if(pass==='admin888') setIsUnlocked(true); 
                                else { alert('密码错误'); setPass(''); }
                            }} 
                            className="bg-zinc-900 p-8 rounded-[2rem] w-full max-w-xs text-center border border-zinc-800 shadow-2xl animate-in zoom-in-95"
                        >
                            <div className="w-16 h-16 bg-zinc-800 rounded-full flex items-center justify-center mx-auto mb-6 border border-zinc-700">
                                <i data-lucide="shield-alert" className="text-indigo-400 w-8 h-8"></i>
                            </div>
                            <h2 className="text-white font-bold mb-2 text-lg tracking-tight">安全拦截</h2>
                            <p className="text-zinc-500 text-xs mb-8">此区域仅限系统管理员访问</p>
                            
                            <input 
                                type="password" 
                                value={pass} 
                                onChange={e=>setPass(e.target.value)} 
                                placeholder="输入管理密码" 
                                className="w-full bg-black border border-zinc-800 rounded-xl p-3.5 text-white mb-4 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-center tracking-widest placeholder:tracking-normal placeholder:text-zinc-600" 
                            />
                            <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl active:scale-95 transition-all shadow-lg shadow-indigo-600/20">
                                验证身份
                            </button>
                        </form>
                    </div>
                );
            }

            // ==========================================
            // 视图 3：真正的管理员后台 (已解锁)
            // ==========================================
            return (
                <div className="flex flex-col md:flex-row h-screen h-[100dvh] bg-zinc-50 text-zinc-900 overflow-hidden font-sans">
                    
                    {/* 左侧：访客列表 (手机端未选中时显示，PC端一直显示) */}
                    <aside className={`${activeSid ? 'hidden md:flex' : 'flex'} w-full md:w-80 flex-col border-r border-zinc-200 bg-white shrink-0`}>
                        <header className="p-4 bg-zinc-900 text-white flex justify-between items-center z-10 shadow-md">
                            <div className="flex items-center gap-2">
                                <i data-lucide="shield-check" className="text-emerald-400 w-5 h-5"></i>
                                <span className="font-bold tracking-tight">控制台</span>
                            </div>
                            <button onClick={()=>setIsUnlocked(false)} className="text-zinc-400 hover:text-white p-1" title="锁定后台">
                                <i data-lucide="lock" className="w-4 h-4"></i>
                            </button>
                        </header>
                        
                        <div className="p-2 bg-zinc-100 border-b border-zinc-200 text-[10px] font-bold text-zinc-500 uppercase tracking-widest text-center">
                            在线目标列表
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            {sessions.length === 0 ? (
                                <div className="p-10 flex flex-col items-center text-zinc-400 space-y-3">
                                    <i data-lucide="radar" className="w-8 h-8 opacity-50 animate-pulse"></i>
                                    <p className="text-sm">雷达静默，暂无访客</p>
                                </div>
                            ) : (
                                sessions.map(s => (
                                    <button 
                                        key={s.id} 
                                        onClick={()=>setActiveSid(s.id)} 
                                        className={`w-full p-4 text-left border-b border-zinc-100 flex gap-3 transition-colors ${
                                            activeSid === s.id ? 'bg-indigo-50 border-l-4 border-l-indigo-600' : 'hover:bg-zinc-50 border-l-4 border-l-transparent'
                                        }`}
                                    >
                                        <div className="w-10 h-10 bg-white border border-zinc-200 rounded-full flex items-center justify-center shrink-0 shadow-sm text-zinc-400 mt-0.5">
                                            <i data-lucide="user" className="w-5 h-5"></i>
                                        </div>
                                        <div className="overflow-hidden flex-1">
                                            <div className="flex justify-between items-center mb-1">
                                                <p className="font-bold text-sm text-zinc-800 truncate">访客 {s.id.slice(-4)}</p>
                                                <span className="text-[10px] text-zinc-400">{new Date(s.lastUpdate).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                                            </div>
                                            <p className="text-xs text-zinc-500 truncate leading-tight">
                                                {s.messages[s.messages.length-1]?.content || '无消息'}
                                            </p>
                                        </div>
                                    </button>
                                ))
                            )}
                        </div>
                    </aside>

                    {/* 右侧：聊天主界面 (手机端选中时显示，PC端一直显示) */}
                    <main className={`${!activeSid ? 'hidden md:flex' : 'flex'} flex-1 flex-col bg-zinc-100 relative`}>
                        {activeSid ? (
                            <>
                                <header className="p-3 md:p-4 border-b border-zinc-200 flex items-center gap-3 bg-white shadow-sm z-10 shrink-0 sticky top-0">
                                    <button onClick={()=>setActiveSid(null)} className="md:hidden p-2 -ml-2 text-zinc-500 hover:bg-zinc-100 rounded-full">
                                        <i data-lucide="arrow-left" className="w-5 h-5"></i>
                                    </button>
                                    <div className="w-9 h-9 md:w-10 md:h-10 bg-zinc-900 text-white rounded-xl flex items-center justify-center font-bold text-xs shrink-0 shadow-inner">
                                        AI
                                    </div>
                                    <div className="flex-1 overflow-hidden">
                                        <p className="font-bold text-sm leading-tight text-zinc-800 truncate">正在伪装回复：访客 {activeSid.slice(-4)}</p>
                                        <div className="flex items-center gap-1.5 mt-0.5">
                                            <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                                            <span className="text-[10px] text-emerald-600 font-bold uppercase tracking-widest truncate">Identity Masking ON</span>
                                        </div>
                                    </div>
                                </header>

                                <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                                    <div className="max-w-4xl mx-auto space-y-4">
                                        {chat?.messages.map((m, i) => (
                                            <div key={i} className={`flex ${m.role==='user'?'justify-start':'justify-end'}`}>
                                                <div className={`p-3.5 rounded-2xl max-w-[85%] md:max-w-[70%] text-[14px] leading-relaxed shadow-sm ${
                                                    m.role==='user' 
                                                    ? 'bg-white border border-zinc-200 text-zinc-800 rounded-tl-none' 
                                                    : 'bg-zinc-900 text-white rounded-tr-none'
                                                }`}>
                                                    <div className="text-[10px] font-bold uppercase opacity-40 mb-1 tracking-wider">
                                                        {m.role==='user' ? '对方发来' : '你发出的伪装'}
                                                    </div>
                                                    <span className="whitespace-pre-wrap break-words">{m.content}</span>
                                                </div>
                                            </div>
                                        ))}
                                        <div ref={chatEndRef} className="h-2" />
                                    </div>
                                </div>

                                <footer className="p-3 md:p-4 border-t border-zinc-200 bg-white pb-safe shrink-0">
                                    <form onSubmit={send} className="max-w-4xl mx-auto flex gap-2 md:gap-3">
                                        <textarea 
                                            value={input} 
                                            onChange={e=>setInput(e.target.value)} 
                                            onKeyDown={handleKeyDown}
                                            placeholder="输入你作为 AI 的回复..." 
                                            className="flex-1 bg-zinc-100 border border-zinc-200 p-3.5 rounded-2xl resize-none h-[56px] max-h-32 outline-none focus:ring-2 focus:ring-zinc-900/20 focus:border-zinc-900 text-[15px] transition-all" 
                                            rows="1"
                                        />
                                        <button 
                                            type="submit" 
                                            disabled={!input.trim()}
                                            className="w-14 md:w-16 shrink-0 bg-zinc-900 text-white rounded-2xl flex items-center justify-center active:scale-95 transition-all shadow-lg shadow-black/10 disabled:opacity-50"
                                        >
                                            <i data-lucide="send" className="w-5 h-5 ml-1"></i>
                                        </button>
                                    </form>
                                    <p className="hidden md:block text-center text-[10px] text-zinc-400 mt-2">按 Enter 发送，Shift + Enter 换行</p>
                                </footer>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-zinc-400 space-y-4">
                                <div className="p-6 bg-white rounded-full shadow-sm border border-zinc-100">
                                    <i data-lucide="bot" className="w-16 h-16 opacity-20"></i>
                                </div>
                                <p className="text-sm font-medium">请从左侧选择目标，开始你的 AI 扮演</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        // 确保图标渲染
        setTimeout(() => {
            if (window.lucide) window.lucide.createIcons();
        }, 300);
        // 监听路由变化时重新渲染图标
        window.addEventListener('hashchange', () => {
            setTimeout(() => {
                if (window.lucide) window.lucide.createIcons();
            }, 100);
        });
    </script>
</body>
</html>
